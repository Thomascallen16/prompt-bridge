name: Prompt Bridge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

cache-mode: none

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate server syntax
        run: node --check server.js
      - name: Validate package metadata
        run: node -e "const p=require('./package.json'); if (!p.scripts?.start) process.exit(1); console.log('package metadata OK')"
