<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Save State</title><meta name="description" content="Save anything. Pick it back up later.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b0d10;color:#eef1f5}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #2a3038;background:#15191f;color:#eef1f5;border-radius:10px;padding:10px 14px}button.primary{background:#eef1f5;color:#0b0d10;border-color:#eef1f5;font-weight:700}header{padding:28px 24px 10px;max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:30px;letter-spacing:-.03em}.tag{color:#8f98a6;font-size:14px}.actions{display:flex;gap:8px}.layout{max-width:1100px;margin:18px auto;padding:0 24px;display:grid;grid-template-columns:300px 1fr;gap:18px}.panel{background:#11151a;border:1px solid #252b33;border-radius:16px;overflow:hidden}.search{padding:14px;border-bottom:1px solid #252b33}input,textarea{width:100%;background:#0b0d10;border:1px solid #292f37;color:#eef1f5;border-radius:10px;padding:11px;outline:none}input:focus,textarea:focus{border-color:#6b7481}.items{max-height:68vh;overflow:auto}.item{padding:14px;border-bottom:1px solid #20252c;cursor:pointer}.item:hover,.item.active{background:#171c22}.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:#7f8895}.editor{padding:22px}.title{font-size:25px;font-weight:700;border:0;background:transparent;padding:0 0 12px}.body{min-height:300px;resize:vertical;line-height:1.55}.url{margin-top:10px}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:#7f8895;font-size:13px;gap:10px}.meta-actions{display:flex;gap:8px}.empty{padding:60px 20px;text-align:center;color:#8f98a6}.hint{margin-top:8px;font-size:13px;color:#6f7885}.status{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px;color:#9aa3af;font-size:13px}.dot{width:7px;height:7px;border-radius:50%;background:#7f8895}.resume{margin-top:14px;padding:12px;border:1px solid #252b33;border-radius:12px;background:#0d1116}.resume a{color:inherit}.resume-label{font-size:12px;color:#7f8895;margin-bottom:6px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.items{max-height:30vh}.body{min-height:260px}header{align-items:flex-start;gap:12px}.actions{flex-wrap:wrap;justify-content:flex-end}}
</style></head>
<body>
<header><div><h1>Save State</h1><div class="tag">Save anything. Pick it back up later.</div></div><div class="actions"><button id="export">Export</button><button id="new" class="primary">+ New state</button></div></header>
<main class="layout"><section class="panel"><div class="search"><input id="search" placeholder="Search saved states…"></div><div id="items" class="items"></div></section><section class="panel"><div id="editor" class="editor"></div></section></main>
<script>
const KEY='save-state-v2';let states=JSON.parse(localStorage.getItem(KEY)||'[]');let selected=null;const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(states));renderList()}
function fmt(t){return new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function esc(s=''){return String(s).replace(/[&<>"\\]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}
function renderList(){const q=$('search').value.toLowerCase();const list=states.filter(s=>(s.title+' '+s.body+' '+(s.url||'')).toLowerCase().includes(q));$('items').innerHTML=list.length?list.map(s=>`<div class="item ${s.id===selected?'active':''}" data-id="${esc(s.id)}"><b>${esc(s.title||'Untitled')}</b><small>${fmt(s.updated)} · ${(s.body||'').length} chars</small></div>`).join(''):`<div class="empty">Nothing saved yet.<div class="hint">Start a state, paste something, and leave. It stays here.</div></div>`;$('items').querySelectorAll('.item').forEach(x=>x.onclick=()=>open(x.dataset.id))}
function open(id){selected=id;const s=states.find(x=>x.id===id);if(!s)return;$('editor').innerHTML=`<div class="status"><span class="dot"></span><span>Saved automatically on this device</span></div><input id="title" class="title" value="${esc(s.title)}" placeholder="What are you saving?"><textarea id="body" class="body" placeholder="Paste or write anything here…">${esc(s.body)}</textarea><input id="url" class="url" value="${esc(s.url||'')}" placeholder="Where were you working? (optional URL)"><div class="meta"><span id="saved">Last saved ${fmt(s.updated)}</span><div class="meta-actions"><button id="copy">Copy contents</button><button id="delete">Delete</button></div></div>${s.url?`<div class="resume"><div class="resume-label">RESUME HERE</div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>`:''}`;$('title').oninput=save;$('body').oninput=save;$('url').oninput=save;$('delete').onclick=()=>{states=states.filter(x=>x.id!==id);selected=null;persist();renderEditor()};$('copy').onclick=()=>navigator.clipboard?.writeText(`${s.title}\n\n${s.body}`);renderList()}
function save(){const s=states.find(x=>x.id===selected);if(!s)return;s.title=$('title').value;s.body=$('body').value;s.url=$('url').value.trim();s.updated=Date.now();persist();$('saved').textContent='Last saved just now'}
function renderEditor(){if(selected)open(selected);else $('editor').innerHTML='<div class="empty">Your saved work lives here.<div class="hint">Create a state, give it a name, paste anything you want to keep, and optionally add the page where you left off.</div></div>'}
function newState(){const s={id:crypto.randomUUID(),title:'Untitled state',body:'',url:'',updated:Date.now()};states.unshift(s);selected=s.id;persist();open(s.id);$('title').focus();$('title').select()}
$('new').onclick=newState;$('search').oninput=renderList;$('export').onclick=()=>{const blob=new Blob([JSON.stringify(states,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='save-state-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};renderList();renderEditor();
</script></body></html>
